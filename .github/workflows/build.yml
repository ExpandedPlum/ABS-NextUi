name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Unit tests
        working-directory: daemon
        run: go vet ./... && go test ./...
      - name: Integration test (real Audiobookshelf server in Docker)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          scripts/integration-test.sh

  pak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: actions/cache@v4
        with:
          path: build/ffmpeg-work/*.tar.xz
          key: ffmpeg-src-7.1.2
      - name: Build pak
        run: make pak
      - uses: actions/upload-artifact@v4
        with:
          name: Audiobookshelf.pak
          path: dist/Audiobookshelf.pak.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Audiobookshelf.pak.zip
            pak/pak.json
